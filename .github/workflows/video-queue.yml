name: Produce queued video
on:
  workflow_dispatch:
    inputs:
      review_only:
        description: Generate and email for review only; never upload to any platform
        type: boolean
        default: true
      review_action:
        description: 'Action for the emailed package (leave approval code empty for normal production)'
        type: choice
        options:
          - approve
          - restart
          - regenerate
          - regenerate_long
          - regenerate_short
          - regenerate_audio
          - regenerate_long_audio
          - regenerate_short_audio
          - regenerate_thumbnail
          - delete
        default: approve
      approval_code:
        description: 'Paste the approval code from that same review email'
        required: false
        type: string
      review_comments:
        description: 'Optional instructions for the selected regeneration action'
        required: false
        type: string
      existing_uploads_removed:
        description: 'Full regenerate only: I confirmed no previous platform copies/drafts remain'
        type: boolean
        default: false
  schedule:
    - cron: '17 13 * * *'
concurrency:
  group: video-production-queue
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  produce:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.review_only || inputs.approval_code != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      REVIEW_ONLY: ${{ inputs.review_only && '1' || '' }}
      REVIEW_ACTION: ${{ inputs.review_action || 'approve' }}
      APPROVAL_CODE: ${{ inputs.approval_code }}
      REVIEW_COMMENTS: ${{ inputs.review_comments }}
      EXISTING_UPLOADS_REMOVED: ${{ inputs.existing_uploads_removed && '1' || '' }}
      VIDEO_WORK_ROOT: /tmp/tell-me-why-work
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      VIDEO_CLOUD_CHECKPOINTS: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_PLAN_MODEL: ${{ vars.OPENAI_PLAN_MODEL || 'gpt-4.1-mini' }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || vars.OPENAI_PLAN_MODEL || 'gpt-4.1-mini' }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      SCRIPT_WEB_FACT_CHECK: ${{ vars.SCRIPT_WEB_FACT_CHECK || '0' }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_ENDPOINT_ID: ${{ vars.RUNPOD_ENDPOINT_ID }}
      RUNPOD_MODEL_VERSION: ${{ vars.RUNPOD_MODEL_VERSION || '2.5' }}
      RUNPOD_REFERENCE_AUDIO: /tmp/tell-me-why-reference.wav
      RUNPOD_DURATION_FACTOR: '1.16'
      RUNPOD_EMOTION: Warm, curious, conversational, and unhurried, with natural breathing room and subtle excitement
      RUNPOD_EMOTION_STRENGTH: '0.5'
      IMAGE_REFERENCE: characters/updated_base.png
      AUDIO_LIBRARY: audio/library.runtime.json
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: '587'
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SUMMARY_EMAIL_TO: tellmewhy.contact25@gmail.com
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      META_PAGE_ID: ${{ vars.META_PAGE_ID || secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_INSTAGRAM_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_ACCOUNT_ID || secrets.META_INSTAGRAM_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: tell-me-why-channel
      - uses: google-github-actions/setup-gcloud@v3
      - name: Install video tools and fetch voice reference
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core tesseract-ocr wamerican
          gcloud storage cp "gs://$GCS_BUCKET/config/reference.wav" "$RUNPOD_REFERENCE_AUDIO"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Download approved audio library
        run: .venv/bin/python -m soundtrack --library audio/library.json --bucket "$GCS_BUCKET"
      - name: Process first unfinished idea
        id: production
        run: .venv/bin/python -m automation.queue_runner --queue video_queue.json --work-root "$VIDEO_WORK_ROOT"
      - name: Save review package
        if: always() && steps.production.outputs.project != ''
        uses: actions/upload-artifact@v4
        with:
          name: video-review-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ steps.production.outputs.project }}/video.mp4
            ${{ steps.production.outputs.project }}/short/video.mp4
            ${{ steps.production.outputs.project }}/script.txt
            ${{ steps.production.outputs.project }}/script.draft.txt
            ${{ steps.production.outputs.project }}/script-quality.json
            ${{ steps.production.outputs.project }}/speech-text.txt
            ${{ steps.production.outputs.project }}/speech-preparation.json
            ${{ steps.production.outputs.project }}/production-review.json
            ${{ steps.production.outputs.project }}/short/production-review.json
            ${{ steps.production.outputs.project }}/short/script.txt
            ${{ steps.production.outputs.project }}/metadata.json
            ${{ steps.production.outputs.project }}/thumbnail.jpg
            ${{ steps.production.outputs.project }}/short/covers/*.jpg
            ${{ steps.production.outputs.project }}/upload-details.json
            ${{ steps.production.outputs.project }}/soundtrack.json
            ${{ steps.production.outputs.project }}/short/soundtrack.json
            ${{ steps.production.outputs.project }}/image-quality.json
            ${{ steps.production.outputs.project }}/short/image-quality.json
            ${{ steps.production.outputs.project }}/narration-quality.json
            ${{ steps.production.outputs.project }}/transcript.json
            ${{ steps.production.outputs.project }}/assets/narration-part-*-quality.json
            ${{ steps.production.outputs.project }}/assets/narration-part-*-transcript.json
            ${{ steps.production.outputs.project }}/short/narration-quality.json
            ${{ steps.production.outputs.project }}/short/transcript.json
            ${{ steps.production.outputs.project }}/short/assets/narration-part-*-quality.json
            ${{ steps.production.outputs.project }}/short/assets/narration-part-*-transcript.json
      - name: Archive completed queue item
        if: steps.production.outputs.completed_item != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          .venv/bin/python -m automation.archive_queue
          --repository "$GITHUB_REPOSITORY"
          --item-id "${{ steps.production.outputs.completed_item }}"
