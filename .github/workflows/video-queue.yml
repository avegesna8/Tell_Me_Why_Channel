name: Produce queued video
on:
  workflow_dispatch:
    inputs:
      review_only:
        description: Generate and email for review only; never upload to YouTube
        type: boolean
        default: true
      review_action:
        description: 'Action for the emailed package (leave IDs empty for normal production)'
        type: choice
        options:
          - approve
          - regenerate
        default: approve
      approve_id:
        description: 'To approve an emailed package, paste its item ID'
        required: false
        type: string
      approval_code:
        description: 'Paste the approval code from that same review email'
        required: false
        type: string
  schedule:
    - cron: '17 13 * * *'
concurrency:
  group: video-production-queue
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  produce:
    if: vars.ENABLE_VIDEO_AUTOMATION == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.review_only || inputs.approve_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      REVIEW_ONLY: ${{ inputs.review_only && '1' || '' }}
      REVIEW_ACTION: ${{ inputs.review_action || 'approve' }}
      APPROVE_ITEM_ID: ${{ inputs.approve_id }}
      APPROVAL_CODE: ${{ inputs.approval_code }}
      VIDEO_WORK_ROOT: /tmp/tell-me-why-work
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      VIDEO_CLOUD_CHECKPOINTS: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_ENDPOINT_ID: ${{ vars.RUNPOD_ENDPOINT_ID }}
      RUNPOD_MODEL_VERSION: ${{ vars.RUNPOD_MODEL_VERSION || '2.5' }}
      RUNPOD_REFERENCE_AUDIO: /tmp/tell-me-why-reference.wav
      RUNPOD_DURATION_FACTOR: '1.11'
      RUNPOD_EMOTION: Curious and conversational, with subtle excitement
      RUNPOD_EMOTION_STRENGTH: '0.5'
      IMAGE_REFERENCE: characters/updated_base.png
      AUDIO_LIBRARY: audio/library.runtime.json
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: '587'
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SUMMARY_EMAIL_TO: ${{ vars.SUMMARY_EMAIL_TO }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: tell-me-why-channel
      - uses: google-github-actions/setup-gcloud@v3
      - name: Install video tools and fetch voice reference
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          gcloud storage cp "gs://$GCS_BUCKET/config/reference.wav" "$RUNPOD_REFERENCE_AUDIO"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Download approved audio library
        run: .venv/bin/python -m soundtrack --library audio/library.json --bucket "$GCS_BUCKET"
      - name: Process first unfinished idea
        id: production
        run: .venv/bin/python -m automation.queue_runner --queue video_queue.json --work-root "$VIDEO_WORK_ROOT"
      - name: Save review package
        if: always() && steps.production.outputs.project != ''
        uses: actions/upload-artifact@v4
        with:
          name: video-review-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ steps.production.outputs.project }}/video.mp4
            ${{ steps.production.outputs.project }}/short/video.mp4
            ${{ steps.production.outputs.project }}/script.txt
            ${{ steps.production.outputs.project }}/short/script.txt
            ${{ steps.production.outputs.project }}/metadata.json
            ${{ steps.production.outputs.project }}/thumbnail.jpg
            ${{ steps.production.outputs.project }}/upload-details.json
            ${{ steps.production.outputs.project }}/soundtrack.json
            ${{ steps.production.outputs.project }}/short/soundtrack.json
