name: Check cloud storage connection
on:
  workflow_dispatch:
    inputs:
      verify_audio:
        description: Download and verify the audio library without generating a video
        type: boolean
        default: false
      inspect_progress:
        description: List saved production files instead of writing a connection probe
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: tell-me-why-channel
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify uploaded audio library
        if: inputs.verify_audio
        env:
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: |
          python3 -m venv "$RUNNER_TEMP/audio-check"
          "$RUNNER_TEMP/audio-check/bin/pip" install google-cloud-storage
          "$RUNNER_TEMP/audio-check/bin/python" -m soundtrack --library audio/library.json --bucket "$GCS_BUCKET"
      - name: Inspect saved production files
        if: inputs.inspect_progress
        env:
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: gcloud storage ls --long "gs://$GCS_BUCKET/pipeline/projects/**"
      - name: Check private bucket read and write access
        if: ${{ !inputs.inspect_progress && !inputs.verify_audio }}
        env:
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
        run: |
          set -euo pipefail
          probe="gs://$GCS_BUCKET/checks/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'connection-check' > "$RUNNER_TEMP/storage-probe.txt"
          gcloud storage cp "$RUNNER_TEMP/storage-probe.txt" "$probe"
          gcloud storage cp "$probe" "$RUNNER_TEMP/storage-readback.txt"
          cmp "$RUNNER_TEMP/storage-probe.txt" "$RUNNER_TEMP/storage-readback.txt"
          gcloud storage rm "$probe"
