name: Reset test videos and generated state
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE TEST DATA to delete recorded YouTube test videos and GCS pipeline outputs'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: video-production-queue
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: tell-me-why-channel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Delete recorded test outputs
        env:
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m automation.reset_test_data --confirm "${{ inputs.confirmation }}"
