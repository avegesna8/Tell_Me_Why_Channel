<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tell Me Why Queue</title>
<style>
:root{color-scheme:dark;--bg:#0a1020;--panel:#121b31;--line:#293653;--text:#f5f7ff;--muted:#a8b3cc;--accent:#7c8cff;--good:#58d68d;--bad:#ff7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172446 0,transparent 35%),var(--bg);font:16px/1.45 system-ui,sans-serif;color:var(--text)}main{width:min(920px,calc(100% - 32px));margin:42px auto 80px}h1{font-size:clamp(30px,5vw,48px);margin:0 0 6px}h2{margin-top:0}.lead,.muted{color:var(--muted)}.card{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:18px;padding:24px;margin-top:22px;box-shadow:0 20px 60px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.wide{grid-column:1/-1}label{display:block;font-weight:650;margin-bottom:7px}input,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#0b1326;color:var(--text);padding:12px;font:inherit}textarea{min-height:125px;resize:vertical}.checks{display:flex;gap:20px;flex-wrap:wrap}.checks label{font-weight:500}.checks input{width:auto;margin-right:7px}button,.button{display:inline-block;border:0;border-radius:11px;background:var(--accent);color:white;padding:12px 18px;font-weight:750;font-size:15px;cursor:pointer;text-decoration:none}button.secondary{background:#263555}button:disabled{opacity:.55;cursor:not-allowed;pointer-events:none}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.status{display:none;padding:14px;border-radius:11px;margin-top:18px;white-space:pre-wrap}.status.show{display:block}.status.good{background:#143626;color:#b8f6d0}.status.bad{background:#401b26;color:#ffd0d7}.item{padding:13px 0;border-top:1px solid var(--line)}.item:first-child{border:0}.tag{display:inline-block;background:#223154;color:#cdd5ff;border-radius:999px;padding:3px 9px;font-size:12px;margin-left:7px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.card{padding:18px}}
</style>
</head>
<body><main>
<h1>Tell Me Why Queue</h1><p class="lead">Add an idea without editing JSON or running Git commands.</p>
<section class="card"><h2>New video idea</h2>
<form id="idea-form"><div class="grid">
<div class="wide"><label for="idea">Video idea</label><input id="idea" required minlength="3" maxlength="500" placeholder="Why do airplanes leave white trails?"></div>
<div class="wide"><label for="notes">Optional notes</label><textarea id="notes" maxlength="5000" placeholder="Explain contrails versus smoke. Keep the science approachable."></textarea></div>
<div><label for="minutes">Long video length (minutes)</label><input id="minutes" type="number" min="0.25" max="30" step="0.25" value="3" required></div>
<div><label for="short">Short length (seconds)</label><input id="short" type="number" min="30" max="60" step="1" value="45" required></div>
<div class="wide checks"><label><input id="enabled" type="checkbox" checked>Enabled</label><label><input id="kids" type="checkbox">Made for kids</label><label><input id="synthetic" type="checkbox">Contains realistic synthetic media</label></div>
</div><div class="actions"><button id="submit" type="submit">Add, commit, and push</button></div></form><div id="status" class="status"></div></section>
<section class="card"><h2>Current queue</h2><div id="queue" class="muted">Loading…</div><div class="actions"><button id="push" class="secondary">Validate and push current queue</button><a id="workflow" class="button" href="#" target="_blank" hidden>Open production workflow</a></div><div id="push-status" class="status"></div></section>
</main><script>
let requestId=crypto.randomUUID();
const show=(el,msg,good)=>{el.textContent=msg;el.className=`status show ${good?'good':'bad'}`};
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});const body=await r.json().catch(()=>({detail:'Unexpected response'}));if(!r.ok)throw new Error(body.detail||'Request failed');return body}
async function refresh(){const data=await api('/api/queue');const q=document.querySelector('#queue');q.innerHTML=data.items.length?data.items.map((x,i)=>`<div class="item"><strong>${i+1}. ${escapeHtml(x.idea)}</strong><span class="tag">${escapeHtml(x.id)}</span><div class="muted">${x.minutes} min · ${x.short_seconds}s Short · ${x.enabled?'enabled':'paused'}</div></div>`).join(''):'No ideas queued.';const push=document.querySelector('#push');push.textContent=data.has_uncommitted_queue_changes?'Validate and push current queue':'Queue already pushed';push.disabled=!data.has_uncommitted_queue_changes;push.setAttribute('aria-disabled',String(push.disabled));document.querySelector('#workflow').href=data.workflow_url}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
document.querySelector('#idea-form').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('#submit'),s=document.querySelector('#status');b.disabled=true;try{const data=await api('/api/ideas',{method:'POST',body:JSON.stringify({request_id:requestId,idea:idea.value,notes:notes.value,minutes:Number(minutes.value),short_seconds:Number(short.value),enabled:enabled.checked,made_for_kids:kids.checked,contains_synthetic_media:synthetic.checked})});show(s,`Added ${data.item_id}\nQueue pushed successfully.`,true);requestId=crypto.randomUUID();e.target.reset();minutes.value=3;short.value=45;enabled.checked=true;document.querySelector('#workflow').hidden=false;await refresh()}catch(err){show(s,err.message,false)}finally{b.disabled=false}});
document.querySelector('#push').addEventListener('click',async()=>{const b=document.querySelector('#push'),s=document.querySelector('#push-status');if(b.disabled)return;b.disabled=true;try{const data=await api('/api/push',{method:'POST'});show(s,data.message,true);document.querySelector('#workflow').hidden=false;await refresh()}catch(err){show(s,err.message,false);b.disabled=false}});refresh().catch(e=>show(document.querySelector('#push-status'),e.message,false));
</script></body></html>
